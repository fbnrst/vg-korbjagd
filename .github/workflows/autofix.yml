name: autofix.ci

# Taken from the prek documentation (https://prek.j178.dev/0.5.9/ci/#automatically-fix-pull-requests-with-autofixci).
# Runs all prek hooks on all files (prek.toml); what the fixing hooks change is committed back by autofix.ci. The GitHub app
# "autofix.ci" must be installed on the repository. The workflow name must stay exactly "autofix.ci" (the service uses it to
# identify the trusted workflow); call autofix-ci/action only once, as the last step.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: j178/prek-action@1382ad72dea72f9d53832f2bcb65b3e87a947204 # v3.0.1
        with:
          install-only: true

      - name: Run prek
        id: prek
        continue-on-error: true
        run: prek run --all-files

      - name: Verify fixes
        if: steps.prek.outcome == 'failure'
        run: prek run --all-files

      - name: Commit fixes
        if: always() && !cancelled()
        uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
