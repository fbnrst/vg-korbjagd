name: autofix.ci  # the name is needed to securely identify the workflow
# All checks run through prek (prek.toml), gitleaks included (the standard hook: staged changes only). What the fixing hooks
# can repair (whitespace, end of files) is committed back to the branch by autofix.ci. The GitHub app "autofix.ci" must be
# installed on the repository for that push to work.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  autofix:
    name: Code checks (prek) and autofix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: j178/prek-action@v3.1.0
      # Last step, as in the autofix.ci setup guide. It also runs after a failed prek step: a fixer that changed files makes
      # its hook fail, and exactly that change is what autofix.ci commits. A run that had to fix something stays red, the new
      # run on the bot's commit is the green one. Failures no fixer can repair (tests, secrets, JSON/YAML) stay red.
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
        if: ${{ !cancelled() }}
