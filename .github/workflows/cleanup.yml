name: Cleanup old lists
# Deletes shared lists that had no activity for 30 days (see docs/retention.md). Needs the secret FIREBASE_SERVICE_ACCOUNT.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    # The service account key bypasses the database rules: only the two steps below get it, not the third-party actions
    env:
      DATABASE_URL: https://vg-korbjagd-default-rtdb.europe-west1.firebasedatabase.app
      MAX_AGE_DAYS: '30'
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Fail loudly: the privacy notice promises deletion after 30 days
      - name: Check secret
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is missing, the cleanup is not running. See docs/retention.md"
            exit 1
          fi
      - name: Delete inactive lists
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/cleanup-lists.mjs
