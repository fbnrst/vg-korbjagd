name: Deploy to GitHub Pages
# One site, two versions: the root shows the latest release (the newest tag "v*"), /dev/ shows the current main.
# Until the first tag exists the root shows main as well.
# A release is published by tagging and then starting this workflow on main (`gh workflow run pages.yml --ref main`): the
# environment github-pages only accepts deployments from the branch main, so a run started by the tag itself is rejected.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main          # the dev site is always main
          fetch-depth: 0     # all tags
      - run: node --test
      - name: Pick the release
        id: release
        run: |
          tag=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then
            echo "::notice::No release tag yet: the root shows main until the first tag (for example v1.0.0) is set"
            tag=main
          fi
          echo "ref=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: $tag"
      - run: git worktree add --detach ../release "${{ steps.release.outputs.ref }}"
      - name: Build the site
        run: |
          RELEASE_LABEL="${{ steps.release.outputs.ref }}" DEV_LABEL="dev $(git rev-parse --short=7 HEAD)" \
            node scripts/build-site.mjs ../release/public public _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
