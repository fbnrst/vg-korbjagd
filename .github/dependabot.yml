# Dependabot opens a pull request when a GitHub Action used in .github/workflows has a new version. The actions that are
# pinned to a commit keep their pin: Dependabot moves the hash and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:          # all updates of one week in a single pull request
        patterns: ['*']
    commit-message:
      prefix: CI
