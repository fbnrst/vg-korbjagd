<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Einkaufsliste</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg">
<meta name="theme-color" content="#4c8c2b">
<style>
:root{--bg:#f4f8ee;--card:#fff;--fg:#1d2b14;--mute:#6b7a60;--green:#4c8c2b;--green2:#e3f0d8;--line:#dfe8d5;--red:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#141a10;--card:#1e2718;--fg:#e8f0e0;--mute:#93a186;--green:#7bc24f;--green2:#2a3a20;--line:#2c3a24;--red:#e46a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:14px}
#dot{width:10px;height:10px;border-radius:50%;background:#e74c3c}#dot.on{background:#8cff6a}
main{max-width:640px;margin:0 auto;padding:12px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
input,button{font:inherit}
input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.btn.sec{background:var(--green2);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:12px;border:0;background:none;color:var(--mute);font-size:15px}
.tabs button.on{color:var(--green);font-weight:700}
.item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--green);background:none;flex:none;color:#fff;font-size:18px;line-height:1}
.item.done .chk{background:var(--green)}
.item.done .t{text-decoration:line-through;color:var(--mute)}
.t{flex:1;min-width:0}.t small{display:block;color:var(--mute)}
.vg{width:84px;padding:6px 8px!important;font-size:14px}
.badge{background:var(--green2);border-radius:999px;padding:2px 8px;font-size:12px;white-space:nowrap}
.x{background:none;border:0;color:var(--mute);font-size:20px;padding:4px}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.emojis button{font-size:26px;border:2px solid transparent;background:var(--bg);border-radius:10px;padding:2px 6px}
.emojis button.on{border-color:var(--green)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin:14px 0;min-height:150px}
.pod{text-align:center;flex:1;max-width:110px}
.pod .bar{background:var(--green);border-radius:10px 10px 0 0;color:#fff;font-weight:700;padding-top:6px}
.pod .e{font-size:34px}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank b{margin-left:auto;font-size:20px}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-120px);background:#222;color:#fff;border-radius:12px;padding:10px 16px;transition:.3s;z-index:20;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.muted{color:var(--mute)}.hide{display:none!important}
.big{font-size:22px;letter-spacing:4px;font-weight:700}
#scanner{position:fixed;inset:0;z-index:30;background:#000;color:#fff;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
#scanner video{width:100%;max-width:520px;flex:1;min-height:0;object-fit:cover;border-radius:14px}
#scanFrame{position:absolute;top:30%;left:50%;width:70%;max-width:340px;height:90px;transform:translateX(-50%);border:3px solid #8cff6a;border-radius:12px;pointer-events:none}
#scanMsg{margin:0;text-align:center}
#eanForm{width:100%;max-width:520px}
</style>
</head>
<body>
<header>
  <span id="dot" title="Verbindung"></span>
  <h1 id="title">🛒 Einkaufsliste</h1>
  <button id="shareBtn" class="hide">Teilen</button>
</header>
<div id="toast"></div>
<div id="scanner" class="hide">
  <video id="cam" playsinline muted></video>
  <div id="scanFrame"></div>
  <p id="scanMsg">Barcode in den Rahmen halten</p>
  <form id="eanForm" class="row"><input type="number" id="eanIn" inputmode="numeric" placeholder="Code von Hand"><button class="btn">OK</button></form>
  <button class="btn sec" id="scanClose" type="button">Schließen</button>
</div>
<main>
  <!-- Willkommen -->
  <section id="vWelcome" class="hide">
    <div class="card">
      <h2 style="margin-top:0">Wer bist du?</h2>
      <input type="text" id="nameIn" placeholder="Dein Name" maxlength="20" autocomplete="off">
      <div class="emojis" id="emojis"></div>
    </div>
    <div class="card">
      <button class="btn" id="newList" style="width:100%">Neue Liste starten</button>
      <p class="muted" style="text-align:center;margin:12px 0 8px">oder einer Liste beitreten</p>
      <div class="row"><input type="text" id="codeIn" placeholder="Code, z. B. K7M2QX" maxlength="6" style="text-transform:uppercase"><button class="btn sec" id="joinBtn">Los</button></div>
      <p id="welcomeErr" class="muted" style="color:var(--red)"></p>
    </div>
  </section>

  <!-- Liste -->
  <section id="vList" class="hide">
    <form id="addForm" class="card row">
      <input type="text" id="addIn" placeholder="Artikel oder VG-Nummer …" autocomplete="off">
      <button class="btn sec" type="button" id="scanBtn" aria-label="Barcode scannen">📷</button>
      <button class="btn">+</button>
    </form>
    <div class="card" id="items"></div>
    <div class="row">
      <button class="btn sec" id="clearBtn">Erledigte entfernen</button>
      <span class="muted" id="count" style="margin-left:auto"></span>
    </div>
  </section>

  <!-- Rangliste -->
  <section id="vScore" class="hide">
    <div class="card">
      <h2 style="margin:0">🏆 Wer packt am meisten in den Korb?</h2>
      <div class="podium" id="podium"></div>
      <div id="ranks"></div>
      <button class="btn sec" id="resetBtn" style="margin-top:12px">Neue Runde</button>
    </div>
  </section>
</main>
<nav class="tabs hide" id="tabs">
  <button data-t="vList" class="on">📝 Liste</button>
  <button data-t="vScore">🏆 Rangliste</button>
</nav>

<script>
'use strict';
const $ = s => document.querySelector(s);
const EMOJIS = ['🦊','🐼','🐯','🦄','🐸','🐙','🦖','🚀','⭐','🍓','🐵','🦁'];
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

const me = LS.get('me', { name: '', emoji: EMOJIS[0] });
let code = new URLSearchParams(location.search).get('list') || LS.get('code', '');
code = (code || '').toUpperCase();
let state = LS.get('state:' + code, { items: {}, scores: {} });
let queue = LS.get('queue:' + code, []);
let es = null, flushing = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
// Name und Emoji in einem Feld speichern, damit der Server nur einen Schlüssel braucht
const userKey = () => `${me.emoji} ${me.name}`;
const splitKey = k => { const i = k.indexOf(' '); return { emoji: k.slice(0, i), name: k.slice(i + 1) }; };

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- Sync ---------- */
// Lokale Vorhersage derselben Regeln wie auf dem Server (optimistisch)
function applyLocal(op) {
  const it = op.id && state.items[op.id];
  const bump = (n, d) => { if (n) state.scores[n] = Math.max(0, (state.scores[n] || 0) + d); };
  if (op.type === 'add' && !it) state.items[op.id] = { id: op.id, title: op.title, amount: 1, vgNum: op.vgNum || null, ean: op.ean || null, checked: false, addedBy: op.user };
  else if (op.type === 'check' && it && it.checked !== !!op.checked) {
    if (op.checked) { it.checked = true; it.checkedBy = op.user; bump(op.user, 1); }
    else { bump(it.checkedBy, -1); it.checked = false; it.checkedBy = null; }
  } else if (op.type === 'setnum' && it) {
    it.vgNum = op.vgNum || null;
    if (op.checkToo && !it.checked) { it.checked = true; it.checkedBy = op.user; bump(op.user, 1); }
  } else if (op.type === 'remove' && it) { if (it.checked) bump(it.checkedBy, -1); delete state.items[op.id]; }
  else if (op.type === 'clearChecked') for (const k in state.items) if (state.items[k].checked) delete state.items[k];
}
function send(op) {
  op.user = userKey();
  applyLocal(op); render();
  queue.push(op); LS.set('queue:' + code, queue);
  flush();
}
async function flush() {
  if (flushing || !queue.length) return;
  flushing = true;
  try {
    while (queue.length) {
      const batch = queue.slice(0, 20);
      const r = await fetch(`/api/lists/${code}/ops`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ops: batch }) });
      if (r.status === 404) { queue = []; break; }
      if (!r.ok) throw new Error('http ' + r.status);
      queue.splice(0, batch.length); LS.set('queue:' + code, queue);
    }
  } catch (e) { setTimeout(flush, 3000); }
  flushing = false;
}
function connect() {
  if (es) es.close();
  es = new EventSource(`/api/lists/${code}/events`);
  es.onopen = () => { $('#dot').classList.add('on'); flush(); };
  es.onerror = () => $('#dot').classList.remove('on');
  es.onmessage = m => {
    const { state: s, event } = JSON.parse(m.data);
    state = s; LS.set('state:' + code, state);
    // Ausstehende eigene Ops wieder oben drauflegen, damit die UI nicht zurückspringt
    for (const op of queue) applyLocal(op);
    render();
    if (event && event.user && event.user !== userKey()) {
      const who = splitKey(event.user), t = esc(event.title || '');
      const txt = { check: `${who.emoji} ${who.name} hat ${event.title} in den Korb gelegt 🛒`,
        add: `${who.emoji} ${who.name} hat ${event.title} hinzugefügt`,
        setnum: `${who.emoji} ${who.name} hat die VG-Nr. für ${event.title} eingetragen`,
        uncheck: `${who.emoji} ${who.name} hat ${event.title} wieder rausgenommen` }[event.kind];
      if (txt) toast(txt);
    }
  };
}

/* ---------- Rendering ---------- */
function render() {
  const items = Object.values(state.items).sort((a, b) => (a.checked - b.checked) || ((a.addedAt || 0) - (b.addedAt || 0)));
  $('#items').innerHTML = items.length ? items.map(i => {
    const by = i.checked && i.checkedBy ? `<span class="badge">${esc(i.checkedBy)}</span>` : '';
    const vg = i.vgNum ? `VG-Nr. ${i.vgNum}` : '';
    const vgIn = i.vgNum ? '' : `<form data-vg="${i.id}"><input class="vg" type="number" inputmode="numeric" placeholder="VG-Nr."></form>`;
    return `<div class="item ${i.checked ? 'done' : ''}">
      <button class="chk" data-chk="${i.id}" aria-label="abhaken">${i.checked ? '✓' : ''}</button>
      <div class="t">${esc(i.title)}<small>${vg}</small></div>${by}${vgIn}
      <button class="x" data-del="${i.id}" aria-label="löschen">×</button></div>`;
  }).join('') : '<p class="muted" style="text-align:center">Noch nichts auf der Liste.</p>';
  const done = items.filter(i => i.checked).length;
  $('#count').textContent = `${done}/${items.length} im Korb`;

  const rank = Object.entries(state.scores).sort((a, b) => b[1] - a[1]);
  const top = rank.slice(0, 3), max = Math.max(1, top[0] ? top[0][1] : 1);
  const order = [top[1], top[0], top[2]].filter(Boolean);
  $('#podium').innerHTML = order.map(([k, n]) => {
    const w = splitKey(k), h = 30 + 80 * n / max, medal = k === top[0][0] ? '🥇' : k === (top[1] || [])[0] ? '🥈' : '🥉';
    return `<div class="pod"><div class="e">${w.emoji}</div><div>${esc(w.name)}</div><div class="bar" style="height:${h}px">${medal} ${n}</div></div>`;
  }).join('') || '<span class="muted">Noch keine Punkte – ab in den Korb!</span>';
  $('#ranks').innerHTML = rank.map(([k, n], i) => `<div class="rank"><span>${i + 1}.</span><span>${esc(k)}</span><b>${n}</b></div>`).join('');
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  const chk = e.target.closest('[data-chk]');
  if (chk) { const it = state.items[chk.dataset.chk]; if (it) send({ type: 'check', id: it.id, checked: !it.checked }); return; }
  const del = e.target.closest('[data-del]');
  if (del) { const it = state.items[del.dataset.del]; if (it && confirm(`„${it.title}“ löschen?`)) send({ type: 'remove', id: it.id }); }
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-vg]');
  if (!f) return;
  e.preventDefault();
  const v = parseInt(f.querySelector('input').value, 10);
  if (v > 0) send({ type: 'setnum', id: f.dataset.vg, vgNum: v, checkToo: true }); // Nummer eingeben = im Korb
});
$('#addForm').onsubmit = e => {
  e.preventDefault();
  const v = $('#addIn').value.trim(); if (!v) return;
  const isNum = /^\d+$/.test(v);
  send({ type: 'add', id: uid(), title: isNum ? `VG-Nr. ${v}` : v, vgNum: isNum ? +v : null });
  $('#addIn').value = '';
};
$('#clearBtn').onclick = () => { if (confirm('Alle abgehakten Artikel entfernen?')) send({ type: 'clearChecked' }); };
$('#resetBtn').onclick = () => { if (confirm('Rangliste für eine neue Runde zurücksetzen?')) send({ type: 'resetScores' }); };
$('#shareBtn').onclick = async () => {
  const url = `${location.origin}/?list=${code}`;
  try { if (navigator.share) return await navigator.share({ title: 'Einkaufsliste', text: `Komm in unsere Einkaufsliste (Code ${code})`, url }); } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast('Link kopiert: ' + code); } catch (e) { prompt('Link zum Teilen:', url); }
};
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  show(b.dataset.t);
});
function show(id) { for (const v of ['vList', 'vScore']) $('#' + v).classList.toggle('hide', v !== id); }

/* ---------- Barcode-Scanner ---------- */
let zxingReader = null, scanStream = null, scanBusy = false;
function loadZxing() {
  if (window.ZXing) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
    s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
}
async function productName(ean) {
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${ean}.json?fields=product_name,product_name_de,brands,quantity`);
    const j = await r.json();
    if (j.status !== 1) return null;
    const p = j.product, name = p.product_name_de || p.product_name;
    return name ? (p.brands ? `${name} (${p.brands.split(',')[0]})` : name) : null;
  } catch (e) { return null; }
}
// Gescannter Code: bekannten Artikel abhaken, sonst neu anlegen und gleich in den Korb legen
async function handleEan(ean) {
  if (scanBusy) return; scanBusy = true;
  try {
    let it = Object.values(state.items).find(i => i.ean === ean);
    if (!it) {
      $('#scanMsg').textContent = 'Suche Produkt …';
      const name = await productName(ean);
      it = name && Object.values(state.items).find(i => i.title.toLowerCase() === name.toLowerCase());
      if (!it) { it = { id: uid(), title: name || `Artikel ${ean}` }; send({ type: 'add', id: it.id, title: it.title, ean }); }
    }
    if (!it.checked) { send({ type: 'check', id: it.id, checked: true }); toast(`✓ ${it.title} im Korb`); }
    else toast(`${it.title} ist schon im Korb`);
    if (navigator.vibrate) navigator.vibrate(60);
    closeScanner();
  } finally { scanBusy = false; }
}
async function openScanner() {
  $('#scanner').classList.remove('hide'); $('#scanMsg').textContent = 'Barcode in den Rahmen halten';
  const video = $('#cam');
  try {
    if ('BarcodeDetector' in window) { // Chrome/Android: schnell und eingebaut
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = scanStream; await video.play();
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      const loop = async () => {
        if (!scanStream) return;
        try { const r = await det.detect(video); if (r[0]) return handleEan(r[0].rawValue); } catch (e) {}
        setTimeout(loop, 200);
      };
      loop();
    } else { // iOS/Safari u. a.: zxing nachladen
      await loadZxing();
      zxingReader = new ZXing.BrowserMultiFormatReader();
      zxingReader.decodeFromConstraints({ video: { facingMode: 'environment' } }, video, (r) => { if (r) handleEan(r.getText()); });
    }
  } catch (e) {
    $('#scanMsg').textContent = 'Kamera nicht verfügbar (HTTPS und Erlaubnis nötig). Code kann unten von Hand eingegeben werden.';
  }
}
function closeScanner() {
  if (zxingReader) { zxingReader.reset(); zxingReader = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
  $('#cam').srcObject = null; $('#scanner').classList.add('hide');
}
$('#scanBtn').onclick = openScanner;
$('#scanClose').onclick = closeScanner;
$('#eanForm').onsubmit = e => { e.preventDefault(); const v = $('#eanIn').value.trim(); $('#eanIn').value = ''; if (/^\d{8,14}$/.test(v)) handleEan(v); };

/* ---------- Start / Beitritt ---------- */
function buildEmojis() {
  $('#emojis').innerHTML = EMOJIS.map(e => `<button type="button" class="${e === me.emoji ? 'on' : ''}">${e}</button>`).join('');
  $('#emojis').onclick = ev => { const b = ev.target.closest('button'); if (!b) return; me.emoji = b.textContent; buildEmojis(); };
}
function needName() {
  const n = $('#nameIn').value.trim().slice(0, 20);
  if (!n) { $('#welcomeErr').textContent = 'Bitte zuerst einen Namen eingeben.'; return false; }
  me.name = n; LS.set('me', me); return true;
}
async function enter(c) {
  const r = await fetch(`/api/lists/${c}`);
  if (!r.ok) { $('#welcomeErr').textContent = 'Diese Liste gibt es nicht.'; return; }
  code = c; LS.set('code', c);
  history.replaceState(null, '', `/?list=${c}`);
  queue = LS.get('queue:' + c, []);
  state = await r.json();
  startList();
}
function startList() {
  $('#vWelcome').classList.add('hide'); $('#tabs').classList.remove('hide'); $('#shareBtn').classList.remove('hide');
  $('#title').textContent = `🛒 ${code}`; show('vList');
  send({ type: 'join' });
  connect();
}
$('#newList').onclick = async () => {
  if (!needName()) return;
  const r = await fetch('/api/lists', { method: 'POST' });
  enter((await r.json()).code);
};
$('#joinBtn').onclick = () => { if (needName()) enter($('#codeIn').value.trim().toUpperCase()); };

buildEmojis();
$('#nameIn').value = me.name;
if (code && me.name) startList();
else { $('#vWelcome').classList.remove('hide'); $('#codeIn').value = code; }
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
