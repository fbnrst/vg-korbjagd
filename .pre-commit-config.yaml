# prek / pre-commit: install with `prek install`, run manually with `prek run --all-files`
exclude: ^public/vendor/
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=600']
      - id: detect-private-key
  - repo: local
    hooks:
      # Secrets: the whole working tree on every run (locally and in CI). The hook that gitleaks ships scans only staged
      # changes, which finds nothing in CI.
      - id: gitleaks
        name: Secrets (gitleaks, whole tree)
        language: golang
        additional_dependencies: ['github.com/zricethezav/gitleaks/v8@v8.30.1']
        entry: gitleaks dir --config .gitleaks.toml --redact --no-banner
        pass_filenames: false
        always_run: true
      - id: node-check
        name: JavaScript syntax (node --check)
        language: system
        entry: node --check
        files: ^public/.*\.js$
      - id: node-test
        name: Tests (node --test)
        language: system
        entry: node --test
        pass_filenames: false
        always_run: true
