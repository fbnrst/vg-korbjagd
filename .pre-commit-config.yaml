# prek / pre-commit: Installation mit `prek install`, manuell mit `prek run --all-files`
exclude: ^public/vendor/
repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=600']
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: node-check
        name: JavaScript-Syntax (node --check)
        language: system
        entry: node --check
        files: ^public/.*\.js$
      - id: node-test
        name: Tests (node --test)
        language: system
        entry: node --test
        pass_filenames: false
        always_run: true
